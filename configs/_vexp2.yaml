# Re-run of V2 + V3 under the no-replay buffer change (global consolidation no longer sees HTCL's
# reservoir for buffer-free methods; the local window still replays it). Only V2/V3 for finetune/EWC/SR
# change; er/der/ser and V1/V4/base are provably unaffected and are read from _vexp / existing runs.
experiment: _vexp2
orders: 20
task_orders:
  - [0, 1, 2, 3, 4]
  - [0, 1, 3, 2, 4]
  - [1, 0, 2, 3, 4]
  - [1, 0, 3, 2, 4]
  - [0, 2, 1, 3, 4]
  - [0, 2, 3, 1, 4]
  - [2, 0, 1, 3, 4]
  - [2, 0, 3, 1, 4]
  - [1, 3, 0, 4, 2]
  - [1, 3, 4, 0, 2]
  - [3, 1, 0, 4, 2]
  - [3, 1, 4, 0, 2]
  - [2, 4, 0, 3, 1]
  - [2, 4, 3, 0, 1]
  - [4, 2, 0, 3, 1]
  - [4, 2, 3, 0, 1]
  - [1, 4, 2, 3, 0]
  - [1, 4, 3, 2, 0]
  - [4, 1, 2, 3, 0]
  - [4, 1, 3, 2, 0]
datasets:
  - {name: splitmnist, num_tasks: 5, classes_per_task: 2, lr: 0.01, batch_size: 64, epochs: 10,
     buffer_size: 50, samples_per_class: 500, scenario: domain}
methods:
  # V2: HTCL as it is now (single jump + guard, skip last)
  - {htcl: {schedule: group, k: 2, levels: 2, guard: true}, sweep: {name: [finetune, er, der, ser, ewc, sr]}}
  # V3: step-size search + merge the last task
  - {htcl: {schedule: group, k: 2, levels: 2, merge_search: true, merge_last: true},
     sweep: {name: [finetune, er, der, ser, ewc, sr]}}
